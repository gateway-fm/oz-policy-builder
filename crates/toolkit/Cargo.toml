[package]
name = "ozpb-toolkit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Facade wiring pure cores into MCP tool operations (used by mcp-server and cli)"

[dependencies]
ozpb-domain = { workspace = true }
ozpb-policy-spec = { workspace = true }
ozpb-evaluator = { workspace = true }
ozpb-synthesizer = { workspace = true }
ozpb-recorder-core = { workspace = true }
ozpb-codegen = { workspace = true }
ozpb-build-runner = { workspace = true }
ozpb-api-types = { workspace = true }
ozpb-registry = { workspace = true }
# The import format lives here. Both shells import through this facade, so the parse and the
# recording that admits it cannot be separated by a caller; the examples drift gate also
# serializes the format rather than hand-writing the committed bytes a reader runs.
ozpb-source-bundle = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

