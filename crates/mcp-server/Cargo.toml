[package]
name = "ozpb-mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "rmcp stdio server exposing the record/synthesize/evaluate/generate tools (no domain logic)"

[[bin]]
name = "ozpb-mcp-server"
path = "src/main.rs"

[dependencies]
ozpb-toolkit = { workspace = true }
ozpb-api-types = { workspace = true }
ozpb-recorder-core = { workspace = true }
ozpb-source-rpc = { workspace = true }
rmcp = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = "1"
axum = "0.8"
tokio-util = "0.7"
url = "2"

[dev-dependencies]
# The stdio suite drives the real binary, so it needs the same fixtures and the same development
# registry signer the toolkit tests use — otherwise the one call this milestone contracts stays
# untested at the boundary that serves it.
ozpb-synthesizer = { workspace = true }
ozpb-registry = { workspace = true }
ozpb-domain = { workspace = true }
