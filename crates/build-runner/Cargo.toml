[package]
name = "ozpb-build-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Bounded local builder and BuildManifest attestation for generated policies"

[dependencies]
ozpb-domain = { workspace = true }
ozpb-codegen = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
wait-timeout = { workspace = true }
# To decode the `contractmetav0` section of a built wasm, whose payload is XDR `SCMetaEntry` —
# the toolchain's own statement of which tools produced the artifact, which the BuildManifest is
# reconciled against. The same pinned version the rest of the workspace decodes XDR with.
stellar-xdr = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
# Fixtures with real strkeys, for the boundary-shape compile test.
ozpb-policy-spec = { workspace = true }
ozpb-synthesizer = { workspace = true }
