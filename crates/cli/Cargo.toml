[package]
name = "ozpb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Human-oriented CLI over the same toolkit library as the MCP server"

[[bin]]
name = "ozpb"
path = "src/main.rs"

[dependencies]
ozpb-domain = { workspace = true }
ozpb-registry = { workspace = true }
ozpb-toolkit = { workspace = true }
ozpb-api-types = { workspace = true }
ozpb-recorder-core = { workspace = true }
ozpb-source-rpc = { workspace = true, features = ["http"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
anyhow = "1"
# `dry-run` holds the spec delegate's key: it rebuilds each offline-domain preimage it signs
# (stellar-xdr), signs with the key (ed25519-dalek, which zeroizes it on drop) and zeroizes every
# copy of the key file it makes (zeroize).
stellar-xdr = { workspace = true }
stellar-strkey = { workspace = true }
ed25519-dalek = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }

[target.'cfg(unix)'.dependencies]
# The worker's process-group kill and the key file's owner check.
nix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
