[package]
name = "ozpb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Human-oriented CLI over the same toolkit library as the MCP server"

[[bin]]
name = "ozpb"
path = "src/main.rs"

[dependencies]
ozpb-domain = { workspace = true }
ozpb-registry = { workspace = true }
ozpb-toolkit = { workspace = true }
ozpb-api-types = { workspace = true }
ozpb-recorder-core = { workspace = true }
ozpb-source-rpc = { workspace = true, features = ["http"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
anyhow = "1"
# `dry-run` holds the spec delegate's key: it rebuilds each offline-domain preimage it signs
# (stellar-xdr), signs with the key (ed25519-dalek, which zeroizes it on drop) and zeroizes every
# copy of the key file it makes (zeroize).
stellar-xdr = { workspace = true }
stellar-strkey = { workspace = true }
ed25519-dalek = { workspace = true }
zeroize = { workspace = true }
# Seeds a new registry custodian key (`ozpb registry keygen`) from the operating system's CSPRNG.
getrandom = { workspace = true }
hex = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
# The worker's process-group kill, the key file's owner check and its no-follow, non-blocking open.
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
# Tests only: the hermetic stub builder, so the publication tests can drive `verify-published`
# to both exit statuses without a toolchain. The CLI's own flags still cannot select it
# (`build_flags_can_never_select_the_unattestable_stub_builder`).
ozpb-build-runner = { workspace = true }
# The registry rehearsal synthesizes a recording that carries the observed account code, which the
# import format cannot express; the shared fixture is that recording.
ozpb-synthesizer = { workspace = true }
