[workspace]
resolver = "2"
# `demo-runs` holds the artifacts of `scripts/demo-tranche1.sh`, and each run writes a complete
# standalone policy crate into it. Without the exclusion cargo walks up from that crate, finds
# this manifest, and refuses to build it as a non-member — so `stellar contract build` fails in
# step 6 on a crate that is perfectly valid, for a reason that has nothing to do with the crate.
#
# `.claude/worktrees` is the same hazard one level further out, and it bites from inside rather
# than from here. A worktree is a complete checkout of this repository placed under that path, so
# a standalone crate in it — `contracts/golden-transfer-policy`, excluded by the worktree's own
# copy of this manifest — keeps walking up and lands on THIS one, which used to claim it. The
# result was `cargo fmt` and `stellar contract build` failing inside every worktree with a
# workspace-membership error about a crate that is fine, while the same commands passed from the
# main checkout. Since the work here happens in worktrees, that is where those gates were not
# running.
exclude = ["contracts", "demo-runs", ".claude/worktrees"]
members = [
    "crates/domain",
    "crates/policy-spec",
    "crates/evaluator",
    "crates/synthesizer",
    "crates/recorder-core",
    "crates/source-bundle",
    "crates/source-rpc",
    "crates/registry",
    "crates/codegen",
    "crates/build-runner",
    "crates/api-types",
    "crates/toolkit",
    "crates/mcp-server",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/gateway-fm/oz-policy-builder"
rust-version = "1.91"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
stellar-xdr = { version = "27", default-features = false, features = ["std", "base64", "serde"] }
stellar-strkey = "0.0.18"
base64 = "0.22"
ed25519-dalek = "2"
proptest = "1"
syn = { version = "2", features = ["full", "parsing"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
rmcp = { version = "2.2", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
clap = { version = "4", features = ["derive", "env"] }
ureq = { version = "2", features = ["json"] }
tempfile = "3"
wait-timeout = "0.2"
# Safe wrappers for killpg(2) and getuid(2). Needed because build-runner is
# `#![forbid(unsafe_code)]`: a timeout must reach the builder's whole process group, and the
# shared build cache must be per-uid and ownership-checked.
nix = { version = "0.29", default-features = false, features = ["signal", "user"] }

ozpb-domain = { path = "crates/domain" }
ozpb-policy-spec = { path = "crates/policy-spec" }
ozpb-evaluator = { path = "crates/evaluator" }
ozpb-synthesizer = { path = "crates/synthesizer" }
ozpb-recorder-core = { path = "crates/recorder-core" }
ozpb-source-bundle = { path = "crates/source-bundle" }
ozpb-source-rpc = { path = "crates/source-rpc" }
ozpb-registry = { path = "crates/registry" }
ozpb-codegen = { path = "crates/codegen" }
ozpb-build-runner = { path = "crates/build-runner" }
ozpb-api-types = { path = "crates/api-types" }
ozpb-toolkit = { path = "crates/toolkit" }

[profile.release]
lto = true
codegen-units = 1
