[package]
name = "ozpb-differential"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
# Test-only crate: the differential suite lives in tests/.

[dev-dependencies]
generated-sub-transfer-r0 = { path = "../golden-transfer-policy" }
generated-soroswap-swap-r0 = { path = "../soroswap-swap-policy" }
soroban-sdk = { version = "=26.1.0", features = ["testutils"] }
stellar-accounts = "=0.7.2"
ozpb-domain = { path = "../../crates/domain" }
ozpb-policy-spec = { path = "../../crates/policy-spec" }
ozpb-evaluator = { path = "../../crates/evaluator" }
ozpb-synthesizer = { path = "../../crates/synthesizer" }
ozpb-codegen = { path = "../../crates/codegen" }
stellar-strkey = "0.0.18"
stellar-xdr = { version = "28", default-features = false, features = ["std", "base64", "serde"] }
ed25519-dalek = "2"
sha2 = "0.10"
serde_json = "1"
ozpb-source-rpc = { path = "../../crates/source-rpc" }
ozpb-recorder-core = { path = "../../crates/recorder-core" }
soroban-ledger-snapshot = "=26.1.0"
hex = "0.4"

# The generated suite test exercises the harness cases against the compiled golden policy.
# Cargo applies this dev-dependency to the package, even though only that test uses it.
ozpb-harness = { path = "../../crates/harness" }
