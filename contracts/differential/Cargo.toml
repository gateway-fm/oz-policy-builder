[package]
name = "ozpb-differential"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
# Test-only crate: the differential suite lives in tests/.

[dev-dependencies]
generated-sub-transfer-r0 = { path = "../golden-transfer-policy" }
soroban-sdk = { version = "=26.1.0", features = ["testutils"] }
stellar-accounts = "=0.7.2"
ozpb-domain = { path = "../../crates/domain" }
ozpb-policy-spec = { path = "../../crates/policy-spec" }
ozpb-evaluator = { path = "../../crates/evaluator" }
ozpb-synthesizer = { path = "../../crates/synthesizer" }
ozpb-codegen = { path = "../../crates/codegen" }
stellar-strkey = "0.0.18"

# Two dev-dependencies stood here and left with the test files that needed them: the second
# generated policy crate, which only `tests/event_payload.rs` used, and the harness, which only
# `tests/generated_suite.rs` used. Both tests belong to a later milestone, so neither edge exists
# in this tree. Recorded because their absence is a boundary and not an oversight: Cargo rejects
# an optional dev-dependency, so an edge used by one `[[test]]` target is package-wide, and
# keeping it would have made this crate depend on code the milestone does not contain.
