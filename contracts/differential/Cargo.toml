[package]
name = "ozpb-differential"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
# Test-only crate: the differential suite lives in tests/.

[dev-dependencies]
generated-sub-transfer-r0 = { path = "../golden-transfer-policy" }
soroban-sdk = { version = "=26.1.0", features = ["testutils"] }
stellar-accounts = "=0.7.2"
ozpb-domain = { path = "../../crates/domain" }
ozpb-policy-spec = { path = "../../crates/policy-spec" }
ozpb-evaluator = { path = "../../crates/evaluator" }
ozpb-synthesizer = { path = "../../crates/synthesizer" }
ozpb-codegen = { path = "../../crates/codegen" }
stellar-strkey = "0.0.18"

# Needed by `tests/event_payload.rs` alone, and it leaves with that file at the milestone
# boundary. That file needs *this* policy and no other: the enforcement-event payload it bounds is
# only unbounded where a rule leaves an argument unconstrained, and the Soroswap rule's
# caller-chosen `deadline` is the one `AnyValue` position either committed crate has. The same
# manifest-level caveat as the harness edge below applies — Cargo has no way to gate a
# dev-dependency on one `[[test]]` target — so the edge is package-wide however few files use it.

# Needed by `tests/generated_suite.rs` alone — no other test file in this crate mentions it — and
# so it leaves with that file at the milestone boundary.
#
# This is as close as the manifest gets: Cargo rejects an optional dev-dependency
# ("dev-dependencies are not allowed to be optional"), which is the only construction that
# could gate it behind the `required-features` of a single `[[test]]` target. The edge from
# this crate to the harness is therefore package-wide however few files use it, and the
# boundary here is a convention rather than something the manifest enforces.
