name: CI
on:
  push:
    branches: [main]
  pull_request:

# Every job here reads the checkout and writes nothing back, but the repository default for the
# workflow token is read/write, so that is what they were handed. Narrowed at the workflow rather
# than left to a repository setting a later admin change can widen without touching this file.
# `nightly live` already declares the same thing.
permissions:
  contents: read

jobs:
  # The contribution model is DCO (CONTRIBUTING.md): one `Signed-off-by` per commit, matching its
  # author. Enforced as a job rather than by an installed app so the rule lives in the tree with
  # everything else that gates a merge, and so a fork's pull request is checked with no app to
  # authorize. Pull requests only — the check is about incoming commits, and applying it to the
  # history that predates the decision would fail every push.
  dco:
    name: DCO (every commit in a pull request is signed off)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: every commit carries a Signed-off-by matching its author
        env:
          # Through the environment, not interpolated into the script: these come from the event
          # payload, and a workflow that splices event fields straight into `run` is the standard
          # script-injection shape even when the field in question is only ever hex.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=""
          for commit in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            author="$(git log -1 --format='%an <%ae>' "$commit")"
            # git's own trailer parser, not a substring search of the whole message. A search
            # accepted `Not Signed-off-by: <author>` — and any line merely containing the
            # phrase — as a valid sign-off. `%(trailers:...)` only reads the trailer block,
            # and `-x` compares the whole value rather than a prefix of it.
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$commit" \
                 | grep -qxF -- "$author"; then
              # Command substitution strips the trailing newline printf wrote, so append one
              # explicitly — otherwise the next entry runs onto this one's last line.
              missing="$missing$(printf '  %s\n    author: %s' \
                "$(git log -1 --format='%h %s' "$commit")" "$author")"$'\n'
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::commits without a Signed-off-by matching their author:"
            printf '%s\n' "$missing"
            echo "Add it with 'git commit -s', or 'git rebase --signoff $BASE_SHA' for a branch"
            echo "that already exists. See CONTRIBUTING.md."
            exit 1
          fi
          echo "every commit in this pull request is signed off"

  host:
    name: host workspace (fmt · clippy · test · dep-rules · determinism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # rustc and stellar-cli are recorded as the build inputs every shipped wasm hash was
      # produced with, and both land inside the hashed bytes. This is the only workflow that runs
      # on a pull request, so it is the only place the assertion can block a merge: the wasm
      # workflow is scheduled, and a pin that drifts there is discovered a day later in a job whose
      # header lists three plausible external causes for a red. Needs no toolchain and takes about
      # a second, so it runs before everything expensive.
      - name: recorded build inputs match the pins in use (rustc · stellar-cli)
        run: bash scripts/check-build-input-pins.sh
      - name: toolchain
        run: rustup show # rust-toolchain.toml pins the channel + components
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: dependency rules (evaluator ↛ codegen; cores transport-free)
        run: bash scripts/check-dep-rules.sh
      # The gate above is only worth its green if a rule cannot go unchecked without saying so.
      # This drives it through crate names that match nothing and asserts it stops.
      - name: dependency rules — the gate still checks what it names
        run: bash scripts/test-check-dep-rules.sh
      - name: test
        run: cargo test --workspace
      # Source determinism, asserted without a toolchain. This previously shelled out to
      # `ozpb generate`, which compiles the policy and therefore needs the stellar CLI that
      # this runner does not have — so the step failed on every push while proving nothing.
      # These tests assert the same property directly: identical spec in, byte-identical
      # source out, and no drift between codegen and the committed golden crates. Wasm-level
      # reproducibility needs the real toolchain and runs in the `nightly live` workflow.
      - name: determinism (codegen byte-identical; golden crates in step)
        run: |
          cargo test -q -p ozpb-codegen generation_is_byte_deterministic
          cargo test -q -p ozpb-codegen golden_crate_matches_committed_output

  contracts:
    name: contracts (differential suite · generated code compiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: differential suite (reference evaluator vs real compiled policy)
        working-directory: contracts
        run: cargo test -p ozpb-differential

      # The hash-determinism bans in `clippy.toml` apply to this workspace too — clippy
      # walks up to the repository root to find it — but the host job's `--workspace` never
      # reaches here, so without this step the ban is declared for two workspaces and
      # enforced on one. Dependencies are already built by the step above.
      - name: clippy (the hash-determinism bans cover this workspace too)
        working-directory: contracts
        run: cargo clippy --all-targets -- -D warnings

      # The generated crates, which the step above does not reach for a reason that is easy to
      # miss: clippy does not lint dependencies. `contracts` excludes them, so
      # golden-transfer-policy enters that invocation only as a path dependency of the
      # differential suite — compiled, never linted. So the artifact this project actually ships
      # was the only Rust in the tree no clippy invocation covered.
      #
      # What was behind the hole was not hypothetical. The emitter wrote
      # `authenticated_signers.len() == 0` — `clippy::len_zero`, warn-by-default, therefore a
      # `-D warnings` failure — into every policy it has ever generated, and OpenZeppelin's
      # conventions rule out silencing it, so there was nothing to do but fix the emitter.
      #
      # `--all-targets` rather than a bare invocation: it compiles the test target too, which is
      # what makes this also the standing check that a generated crate's committed lockfile is a
      # resolution `soroban-sdk`'s `testutils` can build. It was not, until this branch.
      - name: clippy (each generated crate, which linting a dependency does not cover)
        run: |
          ( cd contracts/golden-transfer-policy && cargo clippy --all-targets -- -D warnings )

      # The same hole as the step above, left open when clippy was extended to two workspaces
      # and fmt was not: the host job's `cargo fmt --all --check` cannot reach here either.
      # 30 differences had accumulated behind it, and 4 of them were in a *generated* crate —
      # so the omission was not only untidy source, it was a code generator emitting text
      # rustfmt rewrites, in the artifact this project ships for review.
      #
      # Two invocations, because `--all` means "the members of this workspace" and the generated
      # crate is not a member of one: `contracts` excludes it, since it carries its own
      # `[profile.release]` so it builds standalone. The first invocation does reach
      # golden-transfer-policy, but only through the differential suite's dev-dependency on it — an
      # edge that exists for testing rather than for coverage, and one the milestone boundary may
      # remove. So the crate is named rather than relied upon.
      - name: fmt (this workspace and the generated crate it excludes)
        run: |
          ( cd contracts && cargo fmt --all --check )
          ( cd contracts/golden-transfer-policy && cargo fmt --all --check )

      # The generated crates now ship OpenZeppelin's own `rustfmt.toml`, and most of its options
      # are unstable: a stable rustfmt prints a warning for each and applies only `max_width`,
      # `use_small_heuristics` and `use_field_init_shorthand`. So the step above checks a third of
      # that file. This checks the rest — `imports_granularity`, `group_imports`, `wrap_comments`,
      # `format_macro_bodies` — which is what makes our fmt gate and the library's own
      # (`cargo +nightly fmt --all -- --check`, their CONTRIBUTING.md step 4) the same gate over
      # the same config. Both are kept: stable is what developers here run, and a text that
      # satisfies nightly-with-config must also satisfy stable-with-config.
      #
      # Pinned to a date, not `nightly`. rustfmt's output changes between nightlies, so a floating
      # channel would turn a green tree red with no change to the tree — the reasoning that
      # already pins cargo-deny and cargo-machete, and it applies harder here
      # because this gate's verdict *is* a formatter version. Verified against this date's
      # rustfmt (1.10.0-nightly c54751567b) and, as a cross-check that the emitted layout is not
      # tuned to one build, against the following day's (fb6531d550): both leave the emitted
      # source untouched.
      #
      # Scoped to the generated crates on purpose. The rest of the repository has no
      # rustfmt.toml and is written to rustfmt's defaults; running a nightly with unstable options
      # over it would impose a second style nobody asked for.
      - name: fmt (the generated crates, under the OpenZeppelin config they now ship)
        env:
          NIGHTLY: nightly-2026-08-23
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component rustfmt
          ( cd contracts/golden-transfer-policy && cargo "+$NIGHTLY" fmt --all --check )

  publication-guard:
    name: publication allowlist (no confidential material leaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Architecture §6.5: the public repo is produced from an allowlist. Two steps, because
      # this one only ever sees a tree with nothing planted in it — it says the current tree is
      # clean, which is necessary but is not the negative test §6.5 promises.
      - name: forbidden-content scan
        run: bash scripts/check-publication-allowlist.sh
      # The negative test itself: sentinels are planted into a scratch tree and the gate must
      # refuse each one. It needs no private root, so it means the same thing here as on a
      # developer machine — which matters, because the byte-for-byte half of the gate above
      # cannot run in CI at all, and without this step CI's half was two regexes.
      - name: publication gate refuses a planted sentinel
        run: bash scripts/test-check-publication-allowlist.sh

  unused-deps:
    name: unused dependencies (every manifest in the tree, both workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: toolchain
        run: rustup show # rust-toolchain.toml pins the channel + components
      # check-dep-rules.sh asserts only the ABSENCE of forbidden edges, so a declared-and-
      # never-used dependency passed every gate and had to be found by hand. cargo-machete
      # walks directories rather than workspaces, so one run covers the toolkit workspace,
      # the contracts workspace, and the generated policy crate they both exclude.
      # Pinned for the same reason as cargo-deny: which declarations a
      # version considers "used" is the gate's verdict.
      - name: cargo-machete (pinned)
        run: cargo install cargo-machete --locked --version 0.9.2
      - name: unused-dependency gate
        run: bash scripts/check-unused-deps.sh

  quoted-hashes:
    name: quoted hashes (documents cite values the tree still produces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # A hash quoted in prose that nothing here produces any more is worse than an
      # out-of-date sentence: the reader follows it, cannot reproduce it, and concludes the
      # attestation chain is broken. Whole classes of derived hash move together whenever the
      # canonical encoding changes, and prose does not move with them.
      #
      # Its own job rather than a step inside another, so the summary line names what broke.
      # Reads checked-out files only — no toolchain, no network, about a second.
      - name: quoted hashes resolve to a current artifact or a declared exception
        run: python3 scripts/check-quoted-hashes.py

  supply-chain:
    name: supply-chain (permissive licenses · sources · advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned, not latest — same reasoning as cargo-machete above. cargo-deny decides this
      # gate's verdict, and its advisory-database handling and lint defaults change between
      # releases, so a floating install can turn a green tree red (or the reverse) with no
      # change to the tree. 0.20.2 declares MSRV 1.88, below the repo's pinned 1.91.1.
      - name: cargo-deny (pinned)
        run: cargo install cargo-deny --locked --version 0.20.2
      # deny.toml: every crate (ours + transitive, both workspaces) must be permissively
      # licensed and compatible with shipping under either of this project's licences; flags
      # advisories too.
      - name: license & supply-chain gate
        run: bash scripts/check-licenses.sh
