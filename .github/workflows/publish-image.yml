name: publish image

# Publishes the self-hosted API and TLS proxy images to Docker Hub for a published GitHub Release,
# after every check the self-hosted workflow runs (build-context boundary, TLS and offline
# reproduction, what the endpoint retains, rootless worker containment), on each architecture.
# It deploys nothing and runs no service. A pull request that changes this file runs the same
# build and checks on both architectures without logging in or pushing.
#
# Docker Hub credentials are scoped to release steps. PR builds use a read-only GitHub token.
on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/publish-image.yml
      - scripts/release-oci.sh
      - scripts/test-release-oci.py
      - scripts/require-release-checks.sh
      - scripts/release-artifacts.py

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: verify exact-revision CI and released binaries
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: require successful explicitly dispatched runs for this exact source
        run: bash scripts/require-release-checks.sh
      - name: verify all expected files and their release attestations against the source commit
        run: |
          set -euo pipefail
          revision=$(git rev-parse --verify 'HEAD^{commit}')
          assets=$(mktemp -d)
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$assets" \
            --pattern 'ozpb-*.tar.gz' --pattern 'ozpb-wire-contract-*.json' --pattern 'SHA256SUMS'
          python3 -I scripts/release-artifacts.py check-release-files --label "$RELEASE_TAG" \
            --commit "$revision" --directory "$assets" \
            x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin
          for asset in "$assets"/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-binaries.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$revision" --deny-self-hosted-runners
          done

  build:
    needs: verify-release
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.verify-release.result == 'success') }}
    name: build and test (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      ARCH: ${{ matrix.arch }}
      # Through the environment, not interpolated into scripts: the tag comes from the event
      # payload.
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      REPOSITORY: docker.io/gatewayfm/oz-policy-builder
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: exercise immutable publication recovery
        run: python3 -I scripts/test-release-oci.py
      - name: the release tag names the workspace version
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "release tag $RELEASE_TAG does not name workspace version v$version" >&2
            exit 1
          fi
      - name: build-context publication boundary
        run: |
          python3 scripts/test-hosted-context.py
          python3 scripts/test-hosted-mcp.py
          python3 -B scripts/test-check-hosted-build.py
          python3 -B scripts/test-check-hosted-retention.py
          python3 scripts/test-worker-launcher.py
      - name: build immutable source context and both images
        run: |
          set -euo pipefail
          # One commit for the context and the toolkit commit the image's manifests record.
          revision=$(git rev-parse --verify 'HEAD^{commit}')
          python3 scripts/hosted-context.py "$revision" > "$RUNNER_TEMP/ozpb-context.tar"
          # Associate both images with their reviewed source.
          docker build --pull --target proxy --file deployment/Dockerfile \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.revision=$revision" \
            --tag ozpb-proxy:check - < "$RUNNER_TEMP/ozpb-context.tar"
          docker build --pull --file deployment/Dockerfile \
            --build-arg OZPB_TOOLKIT_SOURCE="$revision" \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.revision=$revision" \
            --tag ozpb-self-host:check - < "$RUNNER_TEMP/ozpb-context.tar"
      - name: restore this run's staged images before testing
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          revision=$(git rev-parse --verify 'HEAD^{commit}')
          suffix="$RELEASE_TAG-$ARCH-run-$GITHUB_RUN_ID"
          bash scripts/release-oci.sh restore ozpb-self-host:check "$REPOSITORY:$suffix" "$revision" "$SOURCE_URL"
          bash scripts/release-oci.sh restore ozpb-proxy:check "$REPOSITORY-proxy:$suffix" "$revision" "$SOURCE_URL"
      - name: TLS transport, real offline artifact reproduction and what the endpoint retains
        run: |
          set -euo pipefail
          export OZPB_IMAGE="$(docker image inspect ozpb-self-host:check --format '{{.Id}}')"
          export OZPB_PROXY_IMAGE="$(docker image inspect ozpb-proxy:check --format '{{.Id}}')"
          # The same commit the build step passed as OZPB_TOOLKIT_SOURCE; the generated manifest must record it.
          export OZPB_TOOLKIT_COMMIT="$(git rev-parse --verify 'HEAD^{commit}')"
          bash scripts/test-hosted-container.sh
      - name: rootless worker containment and independent lifecycle
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes podman uidmap
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          docker save ozpb-self-host:check | podman load >/dev/null
          worker_image=$(podman image inspect ozpb-self-host:check --format '{{.Id}}')
          case "$worker_image" in sha256:*) ;; *) worker_image="sha256:$worker_image" ;; esac
          systemd-run --user --scope --quiet -p Delegate=yes \
            python3 scripts/test-worker-containment.py --image "$worker_image"
      - name: stage this architecture's images
        if: github.event_name == 'release'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          trap 'docker logout docker.io' EXIT
          suffix="$RELEASE_TAG-$ARCH-run-$GITHUB_RUN_ID"
          revision=$(git rev-parse --verify 'HEAD^{commit}')
          bash scripts/release-oci.sh stage ozpb-self-host:check "$REPOSITORY:$suffix" "$revision" "$SOURCE_URL"
          bash scripts/release-oci.sh stage ozpb-proxy:check "$REPOSITORY-proxy:$suffix" "$revision" "$SOURCE_URL"

  publish:
    name: publish multi-architecture images
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      REPOSITORY: docker.io/gatewayfm/oz-policy-builder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: promote the exact staged platform digests
        id: index
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          trap 'docker logout docker.io' EXIT
          api_digest=$(bash scripts/release-oci.sh promote "$REPOSITORY" "$RELEASE_TAG" "$GITHUB_RUN_ID")
          proxy_digest=$(bash scripts/release-oci.sh promote "$REPOSITORY-proxy" "$RELEASE_TAG" "$GITHUB_RUN_ID")
          {
            echo "api_name=$REPOSITORY"
            echo "api_digest=$api_digest"
            echo "proxy_name=$REPOSITORY-proxy"
            echo "proxy_digest=$proxy_digest"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.index.outputs.api_name }}
          subject-digest: ${{ steps.index.outputs.api_digest }}
          push-to-registry: false
          create-storage-record: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.index.outputs.proxy_name }}
          subject-digest: ${{ steps.index.outputs.proxy_digest }}
          push-to-registry: false
          create-storage-record: false
      - name: record the immutable references
        env:
          API: ${{ steps.index.outputs.api_name }}@${{ steps.index.outputs.api_digest }}
          PROXY: ${{ steps.index.outputs.proxy_name }}@${{ steps.index.outputs.proxy_digest }}
        run: |
          {
            echo "### Images for $RELEASE_TAG"
            echo
            echo "Deploy by digest, not by tag:"
            echo
            echo "- \`OZPB_IMAGE=$API\`"
            echo "- \`OZPB_PROXY_IMAGE=$PROXY\`"
          } >> "$GITHUB_STEP_SUMMARY"
