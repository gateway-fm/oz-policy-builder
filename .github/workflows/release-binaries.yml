name: release binaries

# Builds the `ozpb` CLI, the MCP server and the native execution worker for each published GitHub
# Release (pre-releases included) and attaches them to it, with SHA256SUMS, the MCP wire contract
# the built server serves, and a GitHub build-provenance attestation for every asset. It deploys
# nothing and runs no service. A `workflow_dispatch` run is a dry run on the chosen ref: it builds,
# packages and assembles exactly as a release does, and neither attests nor uploads anything. What
# the assets promise is docs/VERSIONING.md; how an operator verifies them, docs/SELF-HOSTING.md.
#
# A workflow of its own rather than more jobs in publish-image.yml: the binaries need a macOS
# runner and permission to write release assets, the images need neither, and a red check in one
# should not hold back the other. Both refuse a release whose tag does not name the workspace
# version, with the same check.
#
# Three stages, so the token that can write the release never sits in a job that runs a build:
#   build     one job per platform, contents: read. Third-party build scripts run here.
#   assemble  contents: read. Checks every package, keeps one wire contract, writes SHA256SUMS.
#             Dry runs stop after it.
#   publish   release only: contents: write, id-token: write, attestations: write. It runs no
#             repository code: it restores the assembled assets, checks them against SHA256SUMS,
#             attests them and uploads them with the preinstalled gh.
# Packages move between jobs through the Actions cache (the pinned actions/cache, not another
# action), under keys naming this run, restored by exact key or the job fails. The dry run
# exercises every hand-off except the last.
#
# Platforms: native builds on GitHub-hosted runners, no cross-compilation — linux x86_64
# (ubuntu-24.04), linux aarch64 (ubuntu-24.04-arm, the runner publish-image.yml already uses) and
# macOS arm64 (macos-15, as nightly-live.yml). The Linux binaries link the runner's glibc and may
# need one as new as Ubuntu 24.04's; the macOS binaries are not signed or notarized.
#
# Uploading after publication fails if the repository turns on GitHub's immutable releases, which
# refuse assets added to a published release; that setting would need a draft-first flow here.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      # Through the environment, not interpolated into scripts: the tag comes from the event
      # payload.
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The check publish-image.yml makes, so a release cannot carry binaries of another version.
      # A dry run is labelled with the version it would release.
      - name: the release tag names the workspace version
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$GITHUB_EVENT_NAME" = release ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo "release tag $RELEASE_TAG does not name workspace version v$version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "LABEL=v$version" >> "$GITHUB_ENV"
      # With no argument, `rustup toolchain install` installs the channel and components
      # rust-toolchain.toml names, as nightly-live.yml's macOS job does. The checks make a
      # runner-image change fail here, by name, rather than ship a binary from another compiler
      # or for another platform under this release's name.
      - name: toolchain (the pinned channel, on the expected host)
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null; then
            echo "::error::this runner image has no rustup" >&2
            exit 1
          fi
          rustup toolchain install --no-self-update
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          release=$(rustc -vV | sed -n 's/^release: //p')
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$release" != "$channel" ] || [ "$host" != "$TARGET" ]; then
            echo "::error::rustc ${release:-unknown} on ${host:-unknown}; expected $channel on $TARGET" >&2
            exit 1
          fi
      # --locked: the committed lockfiles decide every dependency. No build cache: a release is
      # compiled from a clean checkout.
      - name: build (locked, release profile)
        run: |
          set -euo pipefail
          cargo build --locked --release -p ozpb-cli -p ozpb-mcp-server
          cargo build --locked --release --manifest-path execution-runtime/Cargo.toml
      - name: the CLI reports the version it is released as
        run: |
          set -euo pipefail
          reported=$(target/release/ozpb --version)
          if [ "$reported" != "ozpb $VERSION" ]; then
            echo "::error::ozpb --version printed '$reported', expected 'ozpb $VERSION'" >&2
            exit 1
          fi
      # The server lists every tool with the input and output JSON Schemas api-types generates;
      # the export adds the E_* vocabulary. Every platform exports, and assembly requires the
      # copies to be byte-identical.
      - name: export the MCP wire contract from the built server
        run: |
          python3 scripts/release-artifacts.py wire-contract \
            --server target/release/ozpb-mcp-server --label "$LABEL" --commit "$GITHUB_SHA" \
            --out "dist/$TARGET/ozpb-wire-contract-$LABEL.json"
      - name: package each binary with the licence files
        run: |
          set -euo pipefail
          epoch=$(git log -1 --format=%ct)
          for binary in target/release/ozpb target/release/ozpb-mcp-server \
              execution-runtime/target/release/ozpb-execution-runtime; do
            python3 scripts/release-artifacts.py archive --binary "$binary" --label "$LABEL" \
              --target "$TARGET" --epoch "$epoch" --out "dist/$TARGET"
          done
          {
            echo "### $TARGET"
            echo
            echo '```'
            (cd "dist/$TARGET" && shasum -a 256 -- *)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: hand the packages to assembly
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/${{ matrix.target }}
          key: ozpb-release-${{ github.run_id }}-${{ matrix.target }}

  assemble:
    name: assemble and check the release assets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The build jobs checked the tag against this same version.
      - name: the label
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "LABEL=v$version" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/x86_64-unknown-linux-gnu
          key: ozpb-release-${{ github.run_id }}-x86_64-unknown-linux-gnu
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/aarch64-unknown-linux-gnu
          key: ozpb-release-${{ github.run_id }}-aarch64-unknown-linux-gnu
          fail-on-cache-miss: true
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/aarch64-apple-darwin
          key: ozpb-release-${{ github.run_id }}-aarch64-apple-darwin
          fail-on-cache-miss: true
      - name: every platform's packages, one wire contract, SHA256SUMS
        run: |
          set -euo pipefail
          python3 scripts/release-artifacts.py assemble --label "$LABEL" --dist dist --out release \
            x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin
          {
            echo "### Release assets for $LABEL"
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: hand the assets to publishing
        if: github.event_name == 'release'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: release
          key: ozpb-release-${{ github.run_id }}-assembled

  publish:
    name: attest and attach to the release
    if: github.event_name == 'release'
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: release
          key: ozpb-release-${{ github.run_id }}-assembled
          fail-on-cache-miss: true
      # What is attested and uploaded is exactly what assembly listed, nothing more.
      - name: the restored assets are the ones SHA256SUMS lists
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum --strict --check SHA256SUMS
          listed=$(awk '{print $2}' SHA256SUMS | sort)
          present=$(ls -1 | grep -vx SHA256SUMS | sort)
          if [ "$listed" != "$present" ]; then
            echo "::error::the restored assets and SHA256SUMS disagree" >&2
            exit 1
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
          create-storage-record: false
      # No --clobber: an asset already on the release is never replaced. A re-run after a partial
      # upload needs the partial assets deleted by hand first.
      - name: attach the assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY"
      - name: record how to verify them
        run: |
          {
            echo "### Assets attached to $RELEASE_TAG"
            echo
            echo "Every asset, SHA256SUMS included, carries a build-provenance attestation:"
            echo
            echo "- \`gh attestation verify <asset> --repo $GITHUB_REPOSITORY\`"
          } >> "$GITHUB_STEP_SUMMARY"
